<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sistema">
    
    <title>Sistema de Execução</title>
    
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace;
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; touch-action: none; 
        }
        #game-container { width: 100vw; height: 100vh; position: relative; z-index: 1; }
        
        #power-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; }
        .cart-status { color: #00ff00; font-size: 1.2rem; margin-bottom: 40px; text-shadow: 0 0 10px #00ff00; text-transform: uppercase; }
        #power-btn { background-color: transparent; border: 3px solid #ff0000; color: #ff0000; padding: 15px 40px; font-size: 1.8rem; font-weight: bold; font-family: inherit; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.1s ease-in-out; }
        #power-btn:active { background-color: #ff0000; color: #000; transform: scale(0.95); }
        
        #loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .loader-text { color: #fff; font-size: 1.5rem; font-weight: bold; letter-spacing: 3px; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 1; text-shadow: 0 0 15px #fff; } 100% { opacity: 0.2; } }

        #status-msg { display: none; color: #fff; text-align: center; margin-top: 40vh; position: relative; z-index: 10; }

        /* REGRAS DE LAYOUT DO JOGADOR 2 */
        .p2-btn { position: absolute; width: 65px; height: 65px; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; font-family: Arial, sans-serif; z-index: 9999; user-select: none; backdrop-filter: blur(2px); font-size: 18px; }
        .p2-sys-btn { width: 90px; height: 40px; border-radius: 20px; font-size: 14px; }
        .p2-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }
        #joystick-zone { position: absolute; width: 140px; height: 140px; z-index: 9999; }

        @media screen and (orientation: portrait) {
            #joystick-zone { bottom: 15%; left: 10%; }
            #p2-btn-b { bottom: 15%; right: 35%; }
            #p2-btn-a { bottom: 25%; right: 15%; }
            #p2-btn-select { top: 8%; left: 10%; }
            #p2-btn-start { top: 8%; right: 10%; }
        }

        @media screen and (orientation: landscape) {
            #joystick-zone { bottom: 20%; left: 8%; }
            #p2-btn-b { bottom: 20%; right: 20%; }
            #p2-btn-a { bottom: 45%; right: 8%; }
            #p2-btn-select { top: 8%; left: 25%; transform: translateX(-50%); }
            #p2-btn-start { top: 8%; right: 25%; transform: translateX(50%); }
        }
    </style>
</head>
<body>
    
    <div id="p1-toast" style="display: none; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #00ff00; color: #000; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-family: monospace; z-index: 100000; box-shadow: 0 0 10px #00ff00;">
        JOGADOR 2 CONECTADO!
    </div>

    <div id="power-screen">
        <div class="cart-status">Conexão Estabelecida</div>
        <button id="power-btn">POWER ON</button>
    </div>

    <div id="loading-overlay">
        <div class="loader-text" id="loading-text-msg">DECODIFICANDO DADOS...</div>
    </div>

    <div id="game-container"><div id="game"></div></div>
    
    <div id="status-msg">Acesso Negado ou Dados Ausentes.</div>

    <button id="btn-convidar" onclick="mostrarConvite()" style="display: none; position: absolute; width: 90px; top: 10px; right: 10px; z-index: 1000; padding: 5px 0; background: #ff4747; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 11px;">Convidar P2</button>
    
    <div id="tela-convite" style="display: none; position: absolute; top: 15%; left: 50%; transform: translate(-50%, 0); background: white; padding: 20px; text-align: center; z-index: 9999; border-radius: 10px; box-shadow: 0px 0px 15px rgba(0,0,0,0.5);">
        <h2 style="color: black; margin-top: 0;">Convide o Jogador 2</h2>
        <p style="color: black;">Peça para seu amigo escanear com a câmera</p>
        <div id="meu-qrcode" style="display: flex; justify-content: center; margin: 20px 0;"></div>
        <button onclick="document.getElementById('tela-convite').style.display='none'" style="padding: 10px; font-size: 16px; cursor: pointer;">Fechar</button>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sys = urlParams.get('c');
        const dataId = urlParams.get('id');
        const salaDoAmigo = urlParams.get('sala');
        let peerHost;

        if (salaDoAmigo) {
            // =====================================
            // CLIENTE: CELULAR DO JOGADOR 2
            // =====================================
            document.getElementById('power-screen').style.display = 'none';
            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('loading-text-msg').innerText = "CONECTANDO AO HOST...";

            const peerClient = new Peer();
            peerClient.on('open', function() {
                const conexao = peerClient.connect(salaDoAmigo);
                conexao.on('open', function() {
                    document.getElementById('loading-overlay').style.display = 'none';
                    
                    const gameDiv = document.getElementById('game-container');
                    gameDiv.style.width = '100vw';
                    gameDiv.style.height = '100vh';
                    gameDiv.style.background = '#000';
                    
                    let isArcade = (sys === 'fbneo' || sys === 'mame2003');
                    let btnSelectEstilo = isArcade ? 'background:#cba800; color:#000; border:none;' : '';
                    let btnSelectTexto = isArcade ? 'FICHA' : 'SELECT';

                    gameDiv.innerHTML = `
                        <div id="joystick-zone"></div>
                        <div id="p2-btn-b" class="p2-btn" data-pad="1">B</div>
                        <div id="p2-btn-a" class="p2-btn" data-pad="0">A</div>
                        <div id="p2-btn-select" class="p2-btn p2-sys-btn" data-pad="8" style="${btnSelectEstilo}">${btnSelectTexto}</div>
                        <div id="p2-btn-start" class="p2-btn p2-sys-btn" data-pad="9">START</div>
                    `;

                    const joystick = nipplejs.create({
                        zone: document.getElementById('joystick-zone'),
                        mode: 'static',
                        position: { left: '50%', top: '50%' },
                        color: 'white',
                        size: 110
                    });

                    let activeDpad = { 12: 0, 13: 0, 14: 0, 15: 0 };
                    
                    joystick.on('move', function(evt, data) {
                        const x = Math.cos(data.angle.radian);
                        const y = Math.sin(data.angle.radian);
                        
                        const newDpad = {
                            12: y > 0.4 ? 1 : 0,
                            13: y < -0.4 ? 1 : 0,
                            14: x < -0.4 ? 1 : 0,
                            15: x > 0.4 ? 1 : 0
                        };
                        
                        for (let btn in newDpad) {
                            if (newDpad[btn] !== activeDpad[btn]) {
                                conexao.send({ b: parseInt(btn), s: newDpad[btn] });
                                activeDpad[btn] = newDpad[btn];
                            }
                        }
                    });

                    joystick.on('end', function() {
                        for (let btn in activeDpad) {
                            if (activeDpad[btn] === 1) {
                                conexao.send({ b: parseInt(btn), s: 0 });
                                activeDpad[btn] = 0;
                            }
                        }
                    });

                    const botoes = gameDiv.querySelectorAll('.p2-btn');
                    botoes.forEach(btn => {
                        const padIndex = btn.getAttribute('data-pad');
                        if (padIndex !== null) {
                            btn.addEventListener('touchstart', (e) => { 
                                e.preventDefault(); 
                                conexao.send({ b: parseInt(padIndex), s: 1 }); 
                            }, {passive: false});
                            btn.addEventListener('touchend', (e) => { 
                                e.preventDefault(); 
                                conexao.send({ b: parseInt(padIndex), s: 0 }); 
                            }, {passive: false});
                        }
                    });
                });
            });
        
        } else if (sys && dataId) {
            // =====================================
            // HOST: COMPUTADOR OU CELULAR P1
            // =====================================
            const idGamepad = 'Standard gamepad';
            const botoesBase = () => Array(17).fill().map(() => ({ pressed: false, touched: false, value: 0 }));
            
            window.fakeP1 = { id: idGamepad, index: 0, connected: true, timestamp: Date.now(), mapping: 'standard', axes: [0,0,0,0], buttons: botoesBase() };
            window.fakeP2 = { id: idGamepad, index: 1, connected: true, timestamp: Date.now(), mapping: 'standard', axes: [0,0,0,0], buttons: botoesBase() };
            
            const origGetGamepads = navigator.getGamepads.bind(navigator);
            navigator.getGamepads = function() {
                let pads = origGetGamepads() || [];
                return [pads[0] || window.fakeP1, window.fakeP2, pads[2] || null, pads[3] || null];
            };

            document.getElementById('power-btn').addEventListener('click', function() {
                const docElm = document.documentElement;
                if (docElm.requestFullscreen) docElm.requestFullscreen().catch(e => {});
                else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();
                
                document.getElementById('power-screen').style.display = 'none';
                document.getElementById('loading-overlay').style.display = 'flex';
                document.getElementById('btn-convidar').style.display = 'block';
                
                setTimeout(() => {
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) overlay.style.display = 'none';
                }, 10000);

                window.EJS_player = '#game';
                window.EJS_core = sys;
                window.EJS_gameUrl = `roms/${sys}/${dataId}`;
                window.EJS_startOnLoaded = true;
                window.EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';
                
                window.EJS_onGameStart = function() {
                    document.getElementById('loading-overlay').style.display = 'none';
                    injetarLayoutTatico(sys); 
                    configurarP2NoEmulador();
                    
                    const event = new Event('gamepadconnected');
                    event.gamepad = window.fakeP2;
                    window.dispatchEvent(event);
                };

                const script = document.createElement('script');
                script.src = 'https://cdn.emulatorjs.org/latest/data/loader.js';
                document.body.appendChild(script);

                setTimeout(() => {
                    peerHost = new Peer();
                    peerHost.on('open', function(meuID) {
                        const linkConvite = window.location.origin + window.location.pathname + "?c=" + sys + "&id=" + dataId + "&sala=" + meuID;
                        new QRCode(document.getElementById("meu-qrcode"), { text: linkConvite, width: 180, height: 180 });
                    });
                    peerHost.on('connection', function(conexao) {
                        conexao.on('open', function() {
                            configurarP2NoEmulador();
                            document.getElementById('tela-convite').style.display = 'none';
                            
                            const toast = document.getElementById('p1-toast');
                            toast.style.display = 'block';
                            setTimeout(() => { toast.style.display = 'none'; }, 3000);
                        });
                        
                        conexao.on('close', resetarBotoesP2);
                        conexao.on('error', resetarBotoesP2);

                        conexao.on('data', function(dados) {
                            if (dados.b !== undefined) {
                                const btnIndex = dados.b;
                                if(window.fakeP2.buttons[btnIndex]) {
                                    window.fakeP2.buttons[btnIndex].pressed = (dados.s === 1);
                                    window.fakeP2.buttons[btnIndex].value = dados.s;
                                }
                            }
                            window.fakeP2.timestamp = Date.now();
                        });
                    });
                }, 1000);
            });

        } else {
            document.getElementById('power-screen').style.display = 'none';
            document.getElementById('status-msg').style.display = 'block';
        }

        // =====================================
        // P2: mapeamento automático (todos os cores)
        // O EmulatorJS deixa os controles dos jogadores 2-4 VAZIOS por padrão e só
        // atribui um gamepad a um slot se ele já existir quando o menu de controles
        // é criado. Aqui copiamos os botões de gamepad do P1 para o P2 e
        // atribuímos o gamepad virtual (index 1) ao slot do jogador 2.
        // =====================================
        function configurarP2NoEmulador() {
            const emu = window.EJS_emulator;
            if (!emu || !emu.controls || !window.fakeP2) return false;
            const ui = emu.frontend || emu;               // 4.2.4+ usa emu.frontend; 4.2.3 usa emu
            if (!ui.gamepadSelection) return false;

            // 1) Controles do P2 = botões de gamepad (value2) do P1, sem teclas de teclado
            emu.controls[1] = {};
            for (const [btn, cfg] of Object.entries(emu.controls[0] || {})) {
                if (cfg && cfg.value2 !== undefined) emu.controls[1][btn] = { value2: cfg.value2 };
            }

            // 2) Atribui o gamepad virtual do P2 ao slot 1
            const idP2 = window.fakeP2.id + '_' + window.fakeP2.index;
            for (let i = 0; i < ui.gamepadSelection.length; i++) {
                if (i !== 1 && ui.gamepadSelection[i] === idP2) ui.gamepadSelection[i] = '';
            }
            ui.gamepadSelection[1] = idP2;
            if (typeof ui.updateGamepadLabels === 'function') ui.updateGamepadLabels();
            return true;
        }

        function resetarBotoesP2() {
            if (!window.fakeP2) return;
            window.fakeP2.buttons.forEach(b => { b.pressed = false; b.value = 0; });
        }

        function mostrarConvite() { document.getElementById('tela-convite').style.display = 'block'; }

        function injetarLayoutTatico(coreName) {
            setInterval(() => {
                const gameContainer = document.getElementById('game');
                if (!gameContainer) return;
                
                const virtualButtons = Array.from(gameContainer.querySelectorAll('div, span'));
                let btnEsq = null, btnDir = null, btnSelect = null, btnStart = null, btnResetar = null;
                let btnX = null, btnY = null;
                
                virtualButtons.forEach(btn => {
                    const txt = btn.innerText ? btn.innerText.trim() : '';
                    if (txt === 'Rápido' || txt === 'Lento') btn.style.setProperty('display', 'none', 'important');
                    if (txt === 'ESQ') btnEsq = btn;
                    if (txt === 'DIR') btnDir = btn;
                    if (txt === 'Select') btnSelect = btn;
                    if (txt === 'Start') btnStart = btn;
                    if (txt === 'Resetar' || txt === 'Reset') btnResetar = btn;
                    if (txt === 'X') btnX = btn;
                    if (txt === 'Y') btnY = btn;
                });
                
                if ((coreName === 'snes' || coreName === 'sfc') && btnEsq && btnDir && btnSelect && btnStart) {
                    const esqRect = btnEsq.getBoundingClientRect();
                    const dirRect = btnDir.getBoundingClientRect();
                    if (esqRect.bottom > 0 && dirRect.bottom > 0) {
                        btnSelect.style.setProperty('position', 'fixed', 'important');
                        btnSelect.style.setProperty('top', (esqRect.bottom + 15) + 'px', 'important');
                        btnSelect.style.setProperty('left', esqRect.left + 'px', 'important');
                        btnSelect.style.setProperty('bottom', 'auto', 'important');
                        btnSelect.style.setProperty('right', 'auto', 'important');
                        btnSelect.style.setProperty('margin', '0', 'important');
                        btnSelect.style.setProperty('transform', 'none', 'important');
                        btnSelect.style.setProperty('z-index', '9999', 'important');
                        
                        btnStart.style.setProperty('position', 'fixed', 'important');
                        btnStart.style.setProperty('top', (dirRect.bottom + 15) + 'px', 'important');
                        btnStart.style.setProperty('left', 'auto', 'important');
                        const rightOffset = window.innerWidth - dirRect.right;
                        btnStart.style.setProperty('right', rightOffset + 'px', 'important');
                        btnStart.style.setProperty('bottom', 'auto', 'important');
                        btnStart.style.setProperty('margin', '0', 'important');
                        btnStart.style.setProperty('transform', 'none', 'important');
                        btnStart.style.setProperty('z-index', '9999', 'important');
                    }
                }

                if (coreName === 'atari2600' && btnSelect && btnResetar) {
                    const isPortrait = window.innerHeight > window.innerWidth;
                    if (isPortrait) {
                        btnSelect.style.setProperty('position', 'fixed', 'important');
                        btnSelect.style.setProperty('bottom', '35%', 'important');
                        btnSelect.style.setProperty('left', '12%', 'important'); 
                        btnSelect.style.setProperty('top', 'auto', 'important');
                        btnSelect.style.setProperty('right', 'auto', 'important');
                        btnResetar.style.setProperty('position', 'fixed', 'important');
                        btnResetar.style.setProperty('bottom', '35%', 'important');
                        btnResetar.style.setProperty('right', '12%', 'important');
                        btnResetar.style.setProperty('top', 'auto', 'important');
                        btnResetar.style.setProperty('left', 'auto', 'important');
                    } else {
                        btnSelect.style.setProperty('position', 'fixed', 'important');
                        btnSelect.style.setProperty('top', '20%', 'important');
                        btnSelect.style.setProperty('left', '12%', 'important'); 
                        btnSelect.style.setProperty('bottom', 'auto', 'important');
                        btnSelect.style.setProperty('right', 'auto', 'important');
                        btnResetar.style.setProperty('position', 'fixed', 'important');
                        btnResetar.style.setProperty('top', '20%', 'important');
                        btnResetar.style.setProperty('right', '12%', 'important');
                        btnResetar.style.setProperty('bottom', 'auto', 'important');
                        btnResetar.style.setProperty('left', 'auto', 'important');
                    }
                    [btnSelect, btnResetar].forEach(btn => {
                        btn.style.setProperty('margin', '0', 'important');
                        btn.style.setProperty('transform', 'none', 'important');
                        btn.style.setProperty('z-index', '9999', 'important');
                    });
                }

                if (coreName === 'mame2003' || coreName === 'fbneo') {
                    if (btnX) btnX.style.setProperty('display', 'none', 'important');
                    if (btnY) btnY.style.setProperty('display', 'none', 'important');

                    if (btnSelect && btnStart) {
                        const isPortrait = window.innerHeight > window.innerWidth;
                        if (isPortrait) {
                            btnSelect.style.setProperty('position', 'fixed', 'important');
                            btnSelect.style.setProperty('bottom', '40%', 'important');
                            btnSelect.style.setProperty('left', '10%', 'important');
                            btnSelect.style.setProperty('top', 'auto', 'important');
                            btnSelect.style.setProperty('right', 'auto', 'important');
                            
                            btnStart.style.setProperty('position', 'fixed', 'important');
                            btnStart.style.setProperty('bottom', '40%', 'important');
                            btnStart.style.setProperty('right', '10%', 'important');
                            btnStart.style.setProperty('top', 'auto', 'important');
                            btnStart.style.setProperty('left', 'auto', 'important');
                        } else {
                            btnSelect.style.setProperty('position', 'fixed', 'important');
                            btnSelect.style.setProperty('top', '15px', 'important');
                            btnSelect.style.setProperty('left', '15px', 'important');
                            btnSelect.style.setProperty('bottom', 'auto', 'important');
                            btnSelect.style.setProperty('right', 'auto', 'important');
                            
                            btnStart.style.setProperty('position', 'fixed', 'important');
                            btnStart.style.setProperty('top', '15px', 'important');
                            btnStart.style.setProperty('right', '15px', 'important');
                            btnStart.style.setProperty('bottom', 'auto', 'important');
                            btnStart.style.setProperty('left', 'auto', 'important');
                        }
                        [btnSelect, btnStart].forEach(btn => {
                            btn.style.setProperty('margin', '0', 'important');
                            btn.style.setProperty('transform', 'none', 'important');
                            btn.style.setProperty('z-index', '9999', 'important');
                        });
                    }
                }

                if (coreName === 'n64') {
                    const isPortrait = window.innerHeight > window.innerWidth;
                    const encontrarBotaoNativo = (rotulos) => {
                        const lista = Array.isArray(rotulos) ? rotulos : [rotulos];
                        for (let el of virtualButtons) {
                            if (el.children.length > 0) continue;
                            const txt = el.innerText ? el.innerText.trim() : '';
                            if (lista.includes(txt)) {
                                let atual = el;
                                while (atual && atual !== gameContainer) {
                                    const st = window.getComputedStyle(atual);
                                    if (st.position === 'absolute' || st.position === 'fixed' || parseFloat(st.borderRadius) > 0) {
                                        let pai = atual.parentElement;
                                        while (pai && pai !== gameContainer) {
                                            pai.style.setProperty('transform', 'none', 'important');
                                            pai = pai.parentElement;
                                        }
                                        return atual;
                                    }
                                    atual = atual.parentElement;
                                }
                                return el;
                            }
                        }
                        return null;
                    };

                    const n64A = encontrarBotaoNativo(['A']), n64B = encontrarBotaoNativo(['B']), n64Z = encontrarBotaoNativo(['Z']), n64R = encontrarBotaoNativo(['DIR', 'R']), n64L = encontrarBotaoNativo(['ESQ', 'L']);
                    const n64Start = encontrarBotaoNativo(['Start', 'START']), n64CUp = encontrarBotaoNativo(['▲', 'C▲', 'C-Up']), n64CDown = encontrarBotaoNativo(['▼', 'C▼', 'C-Down']);
                    const n64CLeft = encontrarBotaoNativo(['◄', 'C◄', 'C-Left']), n64CRight= encontrarBotaoNativo(['►', 'C►', 'C-Right']);

                    if (n64L) n64L.style.setProperty('display', 'none', 'important');
                    const dpadElements = gameContainer.querySelectorAll('.ejs_dpad_main, .ejs_dpad_container, [class*="dpad"]');
                    dpadElements.forEach(d => d.style.setProperty('display', 'none', 'important'));
                    if (n64R && n64R.innerText.trim() === 'DIR') n64R.innerText = 'R';

                    const estilizarBotao = (el, top, bottom, left, right, w, h, bg, corTexto, radius, fontSize) => {
                        if (!el) return;
                        el.style.setProperty('position', 'fixed', 'important'); el.style.setProperty('top', top, 'important');
                        el.style.setProperty('bottom', bottom, 'important'); el.style.setProperty('left', left, 'important');
                        el.style.setProperty('right', right, 'important'); el.style.setProperty('width', w, 'important');
                        el.style.setProperty('height', h, 'important'); el.style.setProperty('background-color', bg, 'important');
                        el.style.setProperty('color', corTexto, 'important'); el.style.setProperty('border-radius', radius, 'important');
                        el.style.setProperty('border', '2px solid rgba(255,255,255,0.35)', 'important'); el.style.setProperty('display', 'flex', 'important');
                        el.style.setProperty('justify-content', 'center', 'important'); el.style.setProperty('align-items', 'center', 'important');
                        el.style.setProperty('font-weight', 'bold', 'important'); el.style.setProperty('font-size', fontSize, 'important');
                        el.style.setProperty('margin', '0', 'important'); el.style.setProperty('transform', 'none', 'important');
                        el.style.setProperty('z-index', '9999', 'important'); el.style.setProperty('box-shadow', '0 4px 10px rgba(0,0,0,0.6)', 'important');
                    };

                    if (isPortrait) {
                        estilizarBotao(n64Z, 'auto', '42%', '6%', 'auto', '68px', '36px', 'rgba(65, 75, 90, 0.9)', '#fff', '12px', '16px');
                        estilizarBotao(n64Start, 'auto', '40%', '39%', 'auto', '76px', '32px', 'rgba(55, 65, 80, 0.95)', '#fff', '18px', '13px');
                        estilizarBotao(n64R, 'auto', '42%', 'auto','6%', '68px', '36px', 'rgba(65, 75, 90, 0.9)', '#fff', '12px', '16px');

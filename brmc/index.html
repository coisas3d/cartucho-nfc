<p>O Black Rock MC - The Game mudou de endereço.<br><a href="https://coisas3d.github.io/brmc/">Abrir o jogo</a></p>
<script>
  // endereço novo do jogo; leva junto o convite do Jogador 2 (?sala=...)
  var novo = 'https://coisas3d.github.io/brmc/' + location.search + location.hash;
  try {   // remove o modo offline antigo deste endereço (só o do /cartucho-nfc/brmc/)
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (r.scope.indexOf('/cartucho-nfc/') >= 0) r.unregister(); }); });
  } catch (e) {}
  location.replace(novo);
</script>
